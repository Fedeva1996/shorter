name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
          POSTGRES_DB: shorter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Migrations
        env:
          DATABASE_URL: postgresql://admin:admin_password@localhost:5433/shorter_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://admin:admin_password@localhost:5433/shorter_test?schema=public
        run: npm run test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Mover a la carpeta del proyecto
            mkdir -p ~/shorter
            cd ~/shorter

            # Si el repo no existe, lo inicializamos, si no, traemos los cambios
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # Traemos la última versión de la rama actual y reiniciamos
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            # Compilamos el frontend para que tome las variables de producción (si tienes frontend/.env prod, Docker lo usará)
            # Y levantamos los contenedores en modo detached
            docker compose down
            docker compose up --build -d

            # Limpiar imágenes viejas que no se usan (opcional para liberar espacio en Oracle Cloud)
            docker image prune -f
